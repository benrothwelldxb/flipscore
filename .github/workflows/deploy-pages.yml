name: Deploy (Cloudflare Pages)

# Alternative deploy to Cloudflare Pages (static hosting).
#
# NOTE: Pages serves the SPA and everything works EXCEPT online Connected mode,
# whose signaling relay is a Durable Object that only the Worker deploy hosts
# (see deploy.yml). Offline Connected mode (WebRTC + QR) still works on Pages.
#
# Requires CLOUDFLARE_API_TOKEN + CLOUDFLARE_ACCOUNT_ID secrets and a Pages
# project named "flipscorer".
on:
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to Pages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      # SPA fallback for client-side routing. Injected here rather than into
      # public/ so it never reaches the Worker assets deploy (which rejects a
      # /* -> /index.html rule as a loop).
      - name: Add SPA redirect
        run: printf '/*    /index.html    200\n' > dist/_redirects
      - name: Publish to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=flipscorer
