name: Deploy (Cloudflare Worker)

# Recommended deploy: the Worker serves the built SPA as static assets AND hosts
# the Connected-mode signaling relay (the SignalRoom Durable Object). This is
# what wrangler.toml describes.
#
# Add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID as repository secrets, then
# run this workflow (Actions → Deploy (Cloudflare Worker) → Run workflow).
on:
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy Worker + assets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Set a repository variable SITE_URL (e.g. https://flipscorer.example.com)
      # so social-share tags use absolute URLs. Optional; omit for relative.
      - run: npm run build
        env:
          SITE_URL: ${{ vars.SITE_URL }}
      - name: Publish to Cloudflare
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
