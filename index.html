<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- The home wordmark is the LCP element — fetch it early. -->
    <link
      rel="preload"
      as="image"
      href="/brand/wordmark.png"
      fetchpriority="high"
    />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta
      name="theme-color"
      media="(prefers-color-scheme: light)"
      content="#7c3aed"
    />
    <meta
      name="theme-color"
      media="(prefers-color-scheme: dark)"
      content="#0e0b1a"
    />
    <script>
      // Apply the persisted/system theme before first paint to avoid a flash.
      ;(function () {
        try {
          var stored = localStorage.getItem('flipscore-theme')
          var theme = stored ? JSON.parse(stored).state.theme : 'system'
          var dark =
            theme === 'dark' ||
            (theme === 'system' &&
              window.matchMedia('(prefers-color-scheme: dark)').matches)
          var root = document.documentElement
          root.classList.toggle('dark', dark)
          root.style.colorScheme = dark ? 'dark' : 'light'
        } catch (e) {
          /* localStorage unavailable — fall back to CSS defaults */
        }
      })()
    </script>
    <meta name="color-scheme" content="light dark" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <meta name="apple-mobile-web-app-title" content="FlipScorer" />
    <meta
      name="description"
      content="A fast, mobile-first scorekeeper for the card game Flip 7. Host, Pass-the-Phone, or Connected play, a Flip 7 Card Builder, stats, and an installable offline PWA."
    />

    <!-- Open Graph / social sharing. og:image is a same-origin path; set a
         custom domain for absolute-URL scrapers (e.g. Facebook). -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="FlipScorer" />
    <meta property="og:title" content="FlipScorer — Flip 7 scorekeeper" />
    <meta
      property="og:description"
      content="Keep score for game night the Flip 7 way. Host, Pass-the-Phone, or Connected play — installable and works offline."
    />
    <meta property="og:image" content="/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="FlipScorer" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="FlipScorer — Flip 7 scorekeeper" />
    <meta
      name="twitter:description"
      content="Keep score for game night the Flip 7 way. Installable, works offline."
    />
    <meta name="twitter:image" content="/og-image.png" />

    <!-- iOS launch (splash) screens. Android uses the manifest's background +
         icon automatically. -->
    <link
      rel="apple-touch-startup-image"
      media="screen and (device-width: 430px) and (device-height: 932px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)"
      href="/splash-1290x2796.png"
    />
    <link
      rel="apple-touch-startup-image"
      media="screen and (device-width: 393px) and (device-height: 852px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)"
      href="/splash-1179x2556.png"
    />
    <link
      rel="apple-touch-startup-image"
      media="screen and (device-width: 428px) and (device-height: 926px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)"
      href="/splash-1284x2778.png"
    />
    <link
      rel="apple-touch-startup-image"
      media="screen and (device-width: 390px) and (device-height: 844px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)"
      href="/splash-1170x2532.png"
    />
    <link
      rel="apple-touch-startup-image"
      media="screen and (device-width: 414px) and (device-height: 896px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)"
      href="/splash-828x1792.png"
    />
    <link
      rel="apple-touch-startup-image"
      media="screen and (device-width: 375px) and (device-height: 667px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)"
      href="/splash-750x1334.png"
    />

    <title>FlipScorer — Flip 7 scorekeeper</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
